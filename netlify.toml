# Заметки - конфиг Netlify

[build]
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

# Маршрут /api/* задаётся прямо в функции через `export const config = { path: "/api/*" }`,
# поэтому отдельный redirect не нужен. Статика из public/ отдаётся как есть.
